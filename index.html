<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عَبَرنا — كتاب حرب أكتوبر ١٩٧٣</title>
<meta name="description" content="عَبَرنا — كتاب وثائقي تفاعلي عن حرب أكتوبر ١٩٧٣. من الهزيمة… إلى العبور… إلى السلام. صور أرشيفية من ويكيميديا كومنز، وورقه عربي، وقراءة بصفحات بتتقلب.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0b'/%3E%3Cpath d='M13 7l11 9-11 9z' fill='%23d9a441'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Almarai:wght@300;400;700;800&family=Cairo:wght@400;600;700;900&family=Tajawal:wght@300;400;500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="desk" aria-hidden="true"></div>

<!-- ============ top bar ============ -->
<header class="topbar">
  <a class="brand" href="#" id="brand">عَبَر<b>نا</b></a>

  <div class="topbar__mid">
    <button class="tbtn" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false">
      <span aria-hidden="true">☰</span><span class="tbtn__lbl" id="menuLbl">الفصول</span>
    </button>
  </div>

  <div class="topbar__end">
    <span class="pager" id="pager"><b id="pageNow">٠</b> / <span id="pageAll">٠</span></span>
    <button class="btn btn--sm btn--ghost" id="cineBtn" type="button" aria-pressed="false" title="وضع السينما — شرائط سينمائية وتدرّج لوني">
      <span class="btn__ico" aria-hidden="true">◐</span><span>سينما</span>
    </button>
    <button class="btn btn--sm btn--ghost" id="settingsBtn" type="button" aria-haspopup="dialog">
      <span class="btn__ico" aria-hidden="true">⚙</span><span>إعدادات</span>
    </button>
    <button class="btn btn--sm btn--gold" id="playFilm" type="button">
      <span class="btn__ico" aria-hidden="true">▶</span><span>القراءة التلقائية</span>
    </button>
  </div>
</header>

<!-- ============ chapter menu ============ -->
<div class="menu" id="menu" hidden>
  <nav class="menu__list" id="menuList" aria-label="فصول الكتاب"></nav>
</div>

<!-- ============ settings ============ -->
<div class="settings" id="settings" role="dialog" aria-label="الإعدادات" hidden>
  <h4>الإعدادات</h4>
  <div class="setrow">
    <label for="voiceSel">صوت القراءة (Web Speech)</label>
    <select id="voiceSel"><option>جارٍ البحث عن الأصوات…</option></select>
  </div>
  <div class="setrow">
    <label for="volSel">مستوى الصوت</label>
    <input type="range" id="volSel" min="0" max="100" value="70">
  </div>
  <div class="setrow">
    <label class="switch"><input type="checkbox" id="muteChk"> كتم الصوت بالكامل</label>
  </div>
  <div class="setrow">
    <label class="switch"><input type="checkbox" id="motionChk"> تقليل الحركة (بلا أنيميشن قلب)</label>
  </div>
  <p class="setnote">
    مفاتيح: <kbd>←</kbd> الصفحة السابقة · <kbd>→</kbd> الصفحة التالية · <kbd>Space</kbd> تشغيل/إيقاف القراءة التلقائية ·
    <kbd>Esc</kbd> خروج · <kbd>M</kbd> كتم.
  </p>
</div>

<!-- ============ the book ============ -->
<main class="bookwrap" id="bookwrap">
  <div class="book" id="book">
    <div class="book__edges" aria-hidden="true"></div>

    <div class="slot slot--l" id="slotL" aria-hidden="true"></div>
    <div class="slot slot--r" id="slotR"></div>

    <div class="leaf" id="leaf" aria-hidden="true">
      <div class="leaf__face leaf__face--f" id="leafF"></div>
      <div class="leaf__face leaf__face--b" id="leafB"></div>
    </div>

    <!-- shadow the lifting sheet throws onto the page underneath -->
    <div class="book__cast" id="bookCast" aria-hidden="true"></div>

    <div class="book__spine" aria-hidden="true"></div>
  </div>

  <!-- cinematic letterbox -->
  <div class="bar bar--t" aria-hidden="true"></div>
  <div class="bar bar--b" aria-hidden="true"></div>
  <div class="grade" aria-hidden="true"></div>
</main>

<!-- ============ bottom controls ============ -->
<div class="footbar">
  <button class="nav" id="prevBtn" type="button" aria-label="الصفحة السابقة">‹</button>
  <nav class="rail" id="rail" aria-label="فصول الكتاب"></nav>
  <button class="nav" id="nextBtn" type="button" aria-label="الصفحة التالية">›</button>
</div>

<!-- ============ personal photos ============ -->
<input type="file" id="minePick" accept="image/*" hidden>

<noscript>
  <div class="noscript">
    <h2>محتوى بدون جافاسكربت</h2>
    <p>هذا الكتاب الوثائقي التفاعلي يحتاج تفعيل الجافاسكربت في المتصفح لعرض صفحات حرب أكتوبر وقلبها والقراءة الصوتية.</p>
  </div>
</noscript>

<!-- ============ reading / film chrome ============ -->
<div class="subs" id="subs" aria-hidden="true"><div class="subs__box"><p class="subs__text" id="subsText"></p></div></div>

<div class="chrome" id="chrome" hidden>
  <div class="railtip">
    <span class="railtip__now">
      <span class="railtip__num" id="railNum">٠٠</span>
      <span class="railtip__title" id="railTitle">المقدمة</span>
    </span>
    <span class="railtip__silent" id="railSilent" hidden>وضع القراءة الصامتة</span>
    <span class="railtip__tc" id="railTc">٠٠:٠٠</span>
  </div>
  <div class="ctrls">
    <button class="ctrl ctrl--play" id="cPlay" type="button" aria-label="تشغيل / إيقاف" title="تشغيل / إيقاف (Space)">▶</button>
    <button class="ctrl" id="cPrev" type="button" aria-label="الصفحة السابقة" title="السابق (←)">⏮</button>
    <button class="ctrl" id="cNext" type="button" aria-label="الصفحة التالية" title="التالي (→)">⏭</button>
    <button class="ctrl" id="cMute" type="button" aria-label="كتم الصوت" title="كتم (M)">🔊</button>
    <span class="ctrls__keys"><kbd>Space</kbd> <kbd>→</kbd> <kbd>←</kbd> <kbd>M</kbd> <kbd>Esc</kbd></span>
    <button class="ctrl ctrl--exit" id="cExit" type="button" aria-label="خروج" title="خروج (Esc)">⏹</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
